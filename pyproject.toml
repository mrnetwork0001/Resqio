[project]
name = "resqio"
version = "0.1.0"
description = "Resqio — Autonomous Community Disaster & Crisis Logistics Agent (AWS Agents for Humans Hackathon)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ifeanyichukwu Onwo" }]
dependencies = [
    "strands-agents>=1.52.0",
    "strands-agents-tools>=0.8.6",
    "bedrock-agentcore>=1.21.0",
    "twilio>=9.11.0",
    "httpx>=0.28.0",
    "pydantic>=2.13.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.0", "pytest-asyncio>=1.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
